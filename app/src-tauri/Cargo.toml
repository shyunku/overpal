[package]
name = "overpal"
version = "0.1.0"
description = "Palworld base storage overlay"
authors = ["shyunku"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows
# (https://github.com/rust-lang/cargo/issues/8519)
name = "overpal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "sync"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
# folder picker for the game server folder (profile settings)
tauri-plugin-dialog = "2"
# PalDefender is reached over plain http on localhost, so no TLS backend is needed
reqwest = { version = "0.12", default-features = false }

[target.'cfg(windows)'.dependencies]
# foreground window and cursor visibility checks for the overlay
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
